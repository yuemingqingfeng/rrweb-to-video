      window.onload = function () {

        window.pageLoaded();
      };
      function replay(events) {
        window.chromePlayer = new rrweb.Replayer(events);

        let started = false;
        window.chromePlayer.on("start", (payload) => {
          if (started === false) {
            console.log("播放开始");
            started = true;
            window.replayStart();
          }
        });
        let index = 0;
        window.chromePlayer.on("pause", (payload) => {
          console.log("暂停------", index++);
        });
        window.chromePlayer.on("finish", (payload) => {
          console.log("播放结束");
          window.replayEnd();
        });

        window.chromePlayer.on("error",(error) => {
          console.log("rrweb报错了-------")
        })

        window.chromePlayer.play();
      }
    </script>
  </body>
